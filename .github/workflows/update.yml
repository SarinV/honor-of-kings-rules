name: Update HOK rules

on:
  schedule:
    - cron: '23 22 * * *' # 22:23 UTC = next day 06:23 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'sources.json'
      - 'policy.json'
      - 'licenses/**'
      - '.github/workflows/update.yml'

permissions:
  contents: read

concurrency:
  group: update-hok-rules
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test parser, scope and failure preservation
        run: python -m unittest discover -s tests -v
      - name: Fetch every upstream and regenerate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update.py
      - name: Verify reproducibility from source snapshots
        run: python scripts/update.py --check
      - name: Publish validated rules and check status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules data upstream
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: check and update Honor of Kings rules'
          git push origin HEAD:main
      - name: Write run summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads(Path('data/status.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
              report.write('Last successful upstream check: ' + status['last_successful_check_utc'] + '\n\n')
              for profile, count in status['counts'].items():
                  report.write(f'- {profile}: {count} rules\n')
              for source in status['sources']:
                  report.write(f"- {source['id']}: file updated {source['file_updated_at']}; source `{source['commit'][:12]}`\n")
          PY
